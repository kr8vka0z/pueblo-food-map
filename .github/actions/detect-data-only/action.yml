# Detect data-only publish-bot PR — shared by ci.yml ("Lint, typecheck, build")
# and weekly-security-audit.yml ("Dependency CVE Audit"), which skip their
# blocking steps when this reports data_only=true. Needs a checkout with
# fetch-depth: 0 first (merge-base below needs both commits locally, #336).
#
# A branch-name check ALONE would be unsafe: anything pushed to a branch
# literally named "publish-bot" in this repo would silently skip lint/tests
# and the CVE gate. The real safety property is the DIFF -- this only
# reports data_only=true when the PR both (a) really is publish-bot ->
# main/dev, from this repo (not a fork), AND (b) its full base...head diff
# touches EXACTLY src/data/published-venues.ts, the one file the publish
# engine (src/lib/publishVenues.ts) writes. Any other change on that branch
# -- code, a workflow file, a second file alongside the data file -- fails
# this check and gets the full pipeline (#336).
#
# Diffed from the MERGE-BASE of base/head, not a raw two-dot diff (PR review
# on #383): a two-dot diff only equals "this PR's change" when base.sha is
# exactly head's parent. If main/dev advances between the bot branch being
# reset and this run evaluating it -- or a `synchronize` event carries a
# lagging base.sha -- the two-dot diff also shows base's own commits as
# reversed changes, more than one path appears, data_only goes false, and
# the publish PR is blocked by exactly the gate this carve-out exists to
# bypass. Fails closed (safe) either way, but merge-base is what a squash
# merge actually lands, so this is strictly more correct, not looser.
name: Detect data-only publish-bot PR
description: Outputs data_only=true only for a same-repo publish-bot PR whose diff is exactly src/data/published-venues.ts.
outputs:
  data_only:
    description: '"true" or "false"'
    value: ${{ steps.detect.outputs.data_only }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        data_only=false
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" = "publish-bot" ] && [ "$IS_FORK" = "false" ]; then
          changed="$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")"
          if [ "$changed" = "src/data/published-venues.ts" ]; then
            data_only=true
          fi
        fi
        echo "data_only=$data_only" >> "$GITHUB_OUTPUT"
