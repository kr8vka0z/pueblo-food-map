name: CI

on:
  # `dev` is now a permanent deploy branch (deploy-dev.yml auto-deploys every push to
  # dev.pueblofoodmap.com), not just a staging area feeding `main` — PRs into it deserve
  # the same lint/typecheck/test/build gate `main` PRs already get. Found during the
  # robot-deploy rollout: PR #302 merged into `dev` with no CI run at all, since this
  # trigger only ever covered `main`.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow clone -- the data-only
          # detection step below diffs base...head by SHA, which needs both
          # commits present locally (#336).
          fetch-depth: 0

      - name: Detect data-only publish-bot PR
        id: detect
        # A branch-name check ALONE would be unsafe: anything pushed to a
        # branch literally named "publish-bot" in this repo would silently
        # skip lint/tests/audit. The real safety property is the DIFF --
        # this only reports data_only=true when the PR both (a) really is
        # publish-bot -> main/dev, from this repo (not a fork), AND
        # (b) its full base...head diff touches EXACTLY the one generated
        # file the publish engine writes (src/lib/publishVenues.ts,
        # AGENTS.md "Publish -> static"). Any other change on that branch
        # -- code, a workflow file, a second file alongside the data file --
        # fails this check and gets the full pipeline below (#336).
        #
        # Diffed from the MERGE-BASE of base/head, not a raw two-dot diff
        # (PR review on #383): a two-dot diff only equals "this PR's change"
        # when base.sha is exactly head's parent. If main/dev advances
        # between the bot branch being reset and this run evaluating it --
        # or a `synchronize` event carries a lagging base.sha -- the two-dot
        # diff also shows base's own commits as reversed changes, more than
        # one path appears, data_only goes false, and the publish PR is
        # blocked by exactly the gate this carve-out exists to bypass. Fails
        # closed (safe) either way, but merge-base is what a squash merge
        # actually lands, so this is strictly more correct, not looser.
        # Checkout above already uses fetch-depth: 0 (full history), which
        # merge-base needs to resolve.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          data_only=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" = "publish-bot" ] && [ "$IS_FORK" = "false" ]; then
            changed="$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")"
            if [ "$changed" = "src/data/published-venues.ts" ]; then
              data_only=true
            fi
          fi
          echo "data_only=$data_only" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22 to match .node-version and the deploy workflows, so all three
          # share one node_modules cache (native modules are per-Node-version).
          node-version: 22
          cache: npm

      # Reuse the installed node_modules when package-lock.json hasn't changed:
      # a fresh `npm ci` was ~97s of every run. The key changes with the
      # lockfile, so any dependency bump still gets a clean install.
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.data_only != 'true'
        run: npm run lint

      - name: Design tokens — lint (report-only)
        # Alpha CLI: non-blocking. A lint error here is informational only and must
        # never break the build — the tool is pre-stable and may produce false positives.
        if: steps.detect.outputs.data_only != 'true'
        run: npm run design:lint
        continue-on-error: true

      - name: Design tokens — drift guard (blocking)
        # Blocking invariant: DESIGN.md must mirror globals.css @theme for colors,
        # spacing, and radius tokens. Uses a tool-agnostic pure-Node script so this
        # gate survives any change to the designmd CLI version or availability.
        if: steps.detect.outputs.data_only != 'true'
        run: npm run design:drift

      - name: Typecheck
        # Always runs, even for a data-only publish PR — this is what proves
        # the regenerated published-venues.ts still type-checks against the
        # Venue shape (#336).
        run: npm run typecheck

      - name: Test
        # Full suite, without coverage instrumentation: nothing read the
        # coverage report (no floor, no Codecov), and instrumenting made this
        # the slowest step (2026-09-23). `npm run test:coverage` still works
        # locally when a report is wanted.
        if: steps.detect.outputs.data_only != 'true'
        run: npm run test:ci

      - name: Test — published data / venue shape only (data-only publish PR)
        # A scoped-down substitute for the full suite above, not a silent
        # skip (#336): still proves the regenerated published-venues.ts is
        # structurally sound (row shape, benefit-flag overlay wiring, every
        # venue's lat/lng inside the county bbox, hours parsing, JSON-LD
        # schema built from real venue data) without paying for every
        # UI/i18n/a11y test a pure data change can't affect.
        if: steps.detect.outputs.data_only == 'true'
        run: npx vitest run src/lib/publishVenues.test.ts src/__tests__/publishedVenues.test.ts src/__tests__/pueblo-bbox.test.ts src/__tests__/hours.test.ts src/__tests__/venueSchema.test.ts

      - name: npm audit (production deps, high/critical only)
        # Only production deps are shipped to the Worker; dev CVEs stay local.
        # --audit-level=high skips moderate/low. --omit=dev excludes dev deps.
        #
        # Skipped for a data-only publish PR (#336): a newly-published CVE
        # against an unrelated transitive dependency must not block real
        # venue data from reaching the live map. The CVE doesn't go dark --
        # it's still caught by this same check on every non-publish PR, and
        # independently by weekly-security-audit.yml's cron regardless of
        # whether anyone opens a PR at all. This is a deliberate, scoped
        # hole: the diff-scope guard above (data_only) is what keeps it from
        # being a general audit bypass.
        if: steps.detect.outputs.data_only != 'true'
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        # Always runs, even for a data-only publish PR — proves the
        # regenerated data file still statically generates every venue page
        # (opennext/Next static export, #336).
        run: npm run build
        env:
          # Real map token so the Lighthouse job below (which reuses THIS
          # build, #292) renders the map instead of an "unauthorized" blank
          # — matches what the old standalone lighthouse.yml set on its own,
          # now-removed build step. Same URL-restricted public token both
          # deploys use; localhost:3000 (where Lighthouse serves it) is on
          # its Mapbox allowlist. Falls back to empty (map blank,
          # accessibility still measured) if the secret is ever removed.
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Upload build output
        # Shares this one build with the lighthouse job below instead of
        # each workflow running its own `npm run build` (#292 — CI used to
        # build the app twice per PR). .next/cache is excluded: it only
        # speeds up a FUTURE `next build`, `next start` never reads it, and
        # it's usually the bulk of .next's size. include-hidden-files is
        # REQUIRED: upload-artifact treats any dot-prefixed path as hidden
        # and silently uploads zero files without it -- .next itself is one
        # (confirmed: the first version of this step without the flag
        # uploaded an empty artifact and failed the lighthouse job's
        # download step).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextjs-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  # Was its own workflow (lighthouse.yml) with an independent `npm ci` +
  # `npm run build` of the same commit — doubling the build portion of every
  # PR's CI minutes (#292). Now a dependent job that reuses the `ci` job's
  # build artifact instead. Trade-off, deliberate: as a dependent job this
  # only runs when `ci` succeeds (a plain independent workflow would still
  # build-and-measure even if, say, lint failed elsewhere) — accepted
  # because there's no build artifact to audit if `ci` never produces one,
  # and because it removes the double build the issue exists to fix. Stays
  # non-required/advisory exactly as before: this repo's `dev`/`main`
  # rulesets list "Lint, typecheck, build", "SAST Code Analysis (Semgrep)",
  # "Secret Leak Scan (TruffleHog)", "Dependency CVE Audit" as required
  # contexts — "lighthouse" was never one of them and still isn't.
  lighthouse:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        # 22, not the old lighthouse.yml's 20 — the build artifact below was
        # produced under Node 22 (the `ci` job, matching .node-version), so
        # `next start` needs a matching node_modules install rather than the
        # pre-existing 20 pin the standalone workflow happened to carry.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextjs-build
          path: .next

      - name: Start the app and wait until it responds
        run: |
          npm run start &
          # Poll the local server; fail loudly after ~60s instead of letting
          # Lighthouse hit a dead port and report a misleading 404/error.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "app ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=App never started::localhost:3000 did not respond within 60s"
          exit 1

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: http://localhost:3000/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
