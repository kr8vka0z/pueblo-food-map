# Automatic second reader on every human-authored pull request into `dev`.
# Advisory only -- deliberately NOT a required status check, so a Claude outage
# can never freeze merges. Rules it applies live in REVIEW.md (repo root).
# Authenticates with the Claude subscription token (repo secret
# CLAUDE_CODE_OAUTH_TOKEN), not a metered API key. This repo is public, so runs
# cost no GitHub Actions minutes; the job timeout is still the ceiling.
#
# TWO TRAPS, both silent (the job stays green):
#  1. The action skips itself unless this file is byte-identical to the copy on
#     the default branch. Editing it on `dev` switches reviews off until the next
#     promotion -- so keep repo rules in REVIEW.md and leave this file alone.
#  2. Without the `--allowedTools` line below the reviewer may read but not post,
#     and the review is thrown away. A healthy run takes minutes and leaves a
#     PR comment; a 13-second green run reviewed nothing.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # The action mints an OIDC token; only same-repo pull requests can.
  id-token: write

jobs:
  claude-review:
    # Skipped on purpose:
    #  - bot authors (Dependabot): the action refuses non-human actors and would
    #    show a red check on PRs that auto-merge anyway;
    #  - promotion PRs (base main): every commit in them was already reviewed on
    #    its way into dev, so a second pass only burns minutes;
    #  - forks: no OIDC token, would always fail;
    #  - the publish-bot PR (#336): opened with Kyle's personal token, not a bot
    #    account, so the Bot test misses it -- a generated venue-data file with
    #    no code to review.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.ref != 'publish-bot' &&
      github.event.pull_request.base.ref != 'main' &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read REVIEW.md and AGENTS.md at the
            repo root: REVIEW.md defines severity, the checks to run every time,
            this repo's standing rules, and what to skip. Read the change with
            `gh pr diff` and `gh pr view`.

            Report findings grouped Blocker / Important / Nit with
            `path/to/file:line` references and a concrete fix for each.
            Concise, no praise. If the PR is clean, say so in one line.

            Post the whole review as ONE top-level comment with `gh pr comment`.
            Your text output is discarded -- only a posted comment reaches anyone.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
