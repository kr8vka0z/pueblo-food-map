name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # OIDC is required by the Claude action in trusted contexts.
  # Keep this enabled so same repository pull requests can mint a token.
  id-token: write

jobs:
  claude-review:
    # Auto-review every PR from a human author; skip ALL bots (Dependabot,
    # release-please, etc.) — bot PRs auto-merge or release on their own and the
    # action refuses non-human actors, which otherwise shows up as a red check.
    # Also respond to @claude mentions in PR comments for ad-hoc reviews.
    # Fork pull requests do not get OIDC tokens for this job.
    # We skip those runs to avoid false red checks and keep required CI signal clean.
    # Maintainers can still request an explicit review through @claude comments.
    #
    # Also skip the publish-bot PR specifically (#336): it's opened with
    # Kyle's fine-grained personal PAT (see AGENTS.md "Publish -> static",
    # GITHUB_PUBLISH_TOKEN), not a bot account, so `user.type != 'Bot'` above
    # doesn't catch it -- every venue-data publish otherwise fires a paid AI
    # review job against a generated data file with no code to review. The
    # @claude-mention path is untouched, so a maintainer can still request a
    # review on that PR by hand if one is ever actually wanted.
    #
    # Also skip PRs whose base is `main` (dev -> main promotions): every
    # commit in them was already reviewed on its way into `dev`, so a
    # second pass only burns minutes.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.type != 'Bot' &&
       github.event.pull_request.head.ref != 'publish-bot' &&
       github.event.pull_request.base.ref != 'main' &&
       github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a senior software engineer reviewing this pull request
            for the Pueblo Food Access Map — a Next.js 16 + TypeScript +
            Tailwind v4 + Mapbox (react-map-gl) community project that helps Pueblo
            County residents find food resources.

            First read REVIEW.md at the repo root, and AGENTS.md's hard-rules
            content (its "Standing rules" analog — this repo's version lives
            in REVIEW.md itself now; skim AGENTS.md only for the operational
            section the diff actually touches, it is very large). REVIEW.md
            defines severity, the checks to run every time, and this repo's
            standing rules.

            Review the diff in this PR. Focus areas, in priority order:

            1. Correctness — does the change do what its title and description claim?
            2. Bugs and edge cases — null/undefined, off-by-one, async races, SSR vs client.
            3. Security — XSS in user-provided strings, leaked tokens or secrets, unsafe `eval`/`dangerouslySetInnerHTML`, weak validation on any new API surface.
            4. Accessibility — keyboard navigation, color contrast, ARIA labels, screen-reader-friendly DOM, focus management.
            5. Code quality — readability, naming, dead code, over-engineering, premature abstractions.
            6. Domain integrity — venue data must include stable `id`, `name`, `category`, `address`, geocoded `lat`/`lng`, `source`, `last_verified` (see `src/types/venue.ts`). Geolocation handling must be SSR-safe. Mobile layout must remain functional below the `md` breakpoint.
            7. REVIEW.md's standing rules — a diff that breaks one is a Blocker.

            Report findings grouped **Blocker / Important / Nit**, as REVIEW.md
            defines each, with `path/to/file.ts:42` references and a concrete
            fix for each. Concise, no filler, no generic praise. If the PR is
            clean, say so in one line.
