name: Dependabot auto-merge

# Auto-merges Dependabot PRs once required CI passes — but ONLY patch and minor
# bumps (including the grouped minor/patch PRs). Major bumps are left open and
# labelled for a human, because majors can carry breaking changes.
#
# Why this is safe: Dependabot PRs target `dev` (dependabot.yml), whose branch
# ruleset requires four status checks ("Lint, typecheck, build", Semgrep,
# TruffleHog, Dependency CVE Audit), so `gh pr merge --auto` waits for green CI
# before it merges — it never merges a red build.
#
# WHY NOT GITHUB_TOKEN FOR THE MERGE: GitHub deliberately does not start new
# workflow runs for pushes made with the built-in GITHUB_TOKEN (its recursion
# guard). Auto-merge is attributed to whoever enabled it, so enabling it with
# GITHUB_TOKEN meant the resulting push fired NO deploy run at all — the
# deployed site silently kept serving the older build while the branch moved
# ahead, with no red mark anywhere, because the run simply never exists. An
# installation token from a GitHub App is not covered by the guard, so the
# merge it produces does trigger Deploy Dev.
#
# WHY pull_request_target: on plain `pull_request`, a Dependabot PR is given the
# *Dependabot* secret store, which does not hold RELEASE_PLEASE_APP_* — the App
# credentials would arrive empty. `pull_request_target` runs in the base-repo
# context and can read Actions secrets. That is normally a footgun because it
# pairs elevated secrets with untrusted PR code, but this workflow never checks
# out the PR: it only reads Dependabot metadata and calls the `gh` CLI against
# the PR URL. No untrusted code executes here.
#
# WHY there is a repository Actions policy for this file: from 2026-11-02 GitHub
# blocks the `pull_request_target` event in public repositories unless an
# Actions policy explicitly allows it. This repo has policy id 6930, "Allow
# pull_request_target for the two API-only workflows" (Settings -> Actions ->
# Policies; REST `repos/kr8vka0z/pueblo-food-map/actions/policies`, header
# `X-GitHub-Api-Version: 2026-03-10`), created 2026-10-08. It is scoped to
# exactly this file and request-review.yml and allow-lists exactly one event,
# `pull_request_target`. Consequences: adding any other trigger here (e.g.
# `workflow_dispatch`) is blocked until the policy's allowed events are updated,
# and deleting the policy stops this workflow (and request-review.yml) from
# running. A new workflow that needs `pull_request_target` must be added to the
# policy's file list.
#
# RELEASE_PLEASE_APP_* secret names are historical (the GitHub App behind them
# once backed release-please, which no longer exists). The App and its two
# secrets (contents + pull-requests write, proven by this workflow) still back
# this job.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The GitHub App behind the historical RELEASE_PLEASE_APP_* secrets (see
      # the top-of-file note) — it demonstrably holds contents + pull-requests write on this repo.
      # Minted per-run and short-lived; nothing long-lived is stored.
      - name: Mint a GitHub App token
        id: app-token
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for patch & minor bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Hold major bumps for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "needs-manual-review"
          gh pr comment "$PR_URL" --body "🛑 Major version bump — held for manual review (auto-merge covers only patch/minor). Check the changelog for breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
