# DEV ONLY. Prod (`main`) deploys via deploy-prod.yml in this same
# directory. Both envs deploy via GitHub Actions, never the Cloudflare
# dashboard: Workers Builds must stay disconnected (AGENTS.md "Hosting and
# deploys"), or every push double-deploys.
#
# Deploys the `dev` branch to the `pueblo-food-map-staging` Worker at
# dev.pueblofoodmap.com (/admin gated by Better Auth alone — email code +
# passkey, own allowlist and rpID; see AGENTS.md "Admin authentication and
# data"). Gated by the same fast checks deploy-prod.yml runs, plus a
# staging-D1 remote-migration step: unlike a Worker deploy, a D1 schema
# migration is a separate database operation that never auto-applies on
# `wrangler deploy` (production's is the manual AGENTS.md "Promotion
# checklist — D1 migrations").
#
# Auth: same CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID repo secrets as
# deploy-prod.yml (AGENTS.md "Secrets"); no narrower per-env token is used.
#
# Build-time NEXT_PUBLIC_MAPBOX_TOKEN: the SAME URL-restricted public token
# deploy-prod.yml uses. `dev.pueblofoodmap.com` is on that token's Mapbox URL
# allowlist, so it authorizes here — the restriction that makes it safe also
# makes it usable on staging, and no second token is needed. Never point this
# at an unrestricted token: `NEXT_PUBLIC_*` is inlined into the client bundle
# by `vite build` (vinext), and this workflow's bundle is served publicly at
# dev.pueblofoodmap.com, so an unrestricted key would be liftable by anyone
# and billable to Kyle's account (#304). The static JS assets are public
# whatever gates the pages, so gating is not a substitute for restricting the
# token.
# NEXT_PUBLIC_TURNSTILE_SITE_KEY reuses the same secret as prod (Turnstile
# widgets support multiple allowed hostnames on one sitekey, unlike Mapbox's
# no-wildcard restriction) — Kyle should confirm dev.pueblofoodmap.com is an
# allowed hostname on that widget.
#
# NEXT_PUBLIC_TURNSTILE_BOX_SITE_KEY: the second, invisible-mode key
# blessing-box check-ins use instead of the managed-mode key above (AGENTS.md
# "Secrets"). Same reuse convention.
name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Predeploy checks, staging D1 migrate, deploy (staging config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Consumed by the `vite build` step below (vinext inlines NEXT_PUBLIC_*)
      # — see the file-header comment on secret choice/reuse.
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_TURNSTILE_BOX_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_BOX_SITE_KEY }}
      # #485 (PostHog analytics) — POSTHOG_PROJECT_KEY is a GitHub Actions
      # secret (AGENTS.md "Secrets"). GitHub resolves a missing repo secret
      # to an empty string, never a build failure, and analytics.ts's
      # initAnalytics() treats an empty/unset key as a total no-op, so an
      # empty key is a supported state, not an error.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
    steps:
      # Same pinned-SHA third-party actions as deploy-prod.yml — a mutable
      # tag could be repointed to malicious code; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22 (same as ci.yml, shared cache): wrangler >=4.x refuses to run on Node <22
          # (hard version check at startup, observed in run 29660459443).
          # Matches ToastHoster's deploy workflows.
          node-version: 22
          cache: npm
      # Reuse node_modules when the lockfile is unchanged (see ci.yml).
      - id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci
      # Fast gate only. The full test suite is NOT re-run here: nothing lands
      # on `dev` without ci.yml's required "Lint, typecheck, build" check
      # (full suite) passing first — ruleset 22116897. Re-running it cost ~3
      # min per deploy and let a flaky test block an already-green change.
      - run: npm run lint && npm run design:drift && npm run typecheck
      # D1 remote migrations are NOT applied by `wrangler deploy` — must run explicitly against the staging database on every
      # deploy that could carry a schema change. `--env staging` resolves
      # the env.staging ADMIN_DB binding (pueblo-food-map-admin-staging) via
      # wrangler.jsonc, not the top-level prod binding.
      - run: npx wrangler d1 migrations apply pueblo-food-map-admin-staging --remote --env staging
      # CLOUDFLARE_ENV=staging makes the build resolve wrangler.jsonc's
      # env.staging block (worker `pueblo-food-map-staging`, route
      # dev.pueblofoodmap.com, staging D1/R2, no cron) and flatten it into
      # dist/server/wrangler.json. `wrangler deploy` then reads that file via
      # .wrangler/deploy/config.json, so it takes no --env (adding one is an error).
      - run: CLOUDFLARE_ENV=staging npx vite build
      - run: npx wrangler deploy
      # Post-deploy smoke check, the staging twin of deploy-prod.yml's. Staging
      # had none, so a next / OpenNext bump (the stack before vinext) that 404'd every prerendered venue
      # page sat live on dev.pueblofoodmap.com for days with every run green,
      # and the release to prod was one merge away from inheriting it.
      # WHY workers.dev, not dev.pueblofoodmap.com (#773): the zone runs
      # Cloudflare Bot Fight Mode, which on the Free plan no WAF rule can skip,
      # and it answers 403 to every GitHub-hosted runner request. Prod's smoke
      # uses its workers.dev origin for the same reason; wrangler.jsonc's
      # env.staging `workers_dev: true` keeps staging's switched on.
      # Same retry as prod: `deploy` returning is not the new version serving,
      # and a fresh deployment can take a moment to reach every location.
      # A red run here is the signal; a failure never rolls anything back.
      - name: Smoke test staging (post-deploy)
        run: |
          set -e
          ORIGIN="https://pueblo-food-map-staging.kyle-boyd.workers.dev"
          VENUE_ID=$(grep -m1 '"id":' src/data/published-venues.ts | sed -E 's/.*"id": *"([^"]+)".*/\1/')
          if [ -z "$VENUE_ID" ]; then
            echo "Smoke check failed: could not read a venue id from src/data/published-venues.ts" >&2
            exit 1
          fi
          attempts=6
          status=0
          # curl prints "000" itself via -w when the connection fails, so `|| true`
          # (not `|| echo 000`, which appended a second 000 and made "000000").
          # --max-time keeps one hung request from eating the job's timeout.
          for path in "/" "/venues" "/venue/${VENUE_ID}" "/es" "/es/venues" "/es/venue/${VENUE_ID}" "/report/${VENUE_ID}" "/sitemap.xml"; do
            code=""
            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "${ORIGIN}${path}") || true
              [ "$code" = "200" ] && break
              if [ "$i" -lt "$attempts" ]; then
                echo "GET ${ORIGIN}${path} -> ${code} (attempt ${i}/${attempts}, retrying in 10s)"
                sleep 10
              fi
            done
            echo "GET ${ORIGIN}${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "Smoke check failed: ${path} returned ${code}, expected 200" >&2
              status=1
            fi
          done
          # /es must be the /es tree (a 200 alone would also pass for the EN page).
          body=$(curl -sS --max-time 20 "${ORIGIN}/es/venue/${VENUE_ID}") || body=""
          if ! printf '%s' "$body" | grep -q '<html lang="es"'; then
            echo "Smoke check failed: /es/venue/${VENUE_ID} body is missing <html lang=\"es\">" >&2
            status=1
          fi
          # Unmatched URLs must be a real 404 (not a soft 200, not a 500). Retried
          # only past a failed fetch (000), never past a wrong status.
          for missing in "/smoke-check-no-such-page" "/venue/smoke-check-no-such-venue" "/es/venue/smoke-check-no-such-venue" "/event/smoke-check-no-such-event"; do
            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "${ORIGIN}${missing}") || true
              [ "$code" != "000" ] && break
              if [ "$i" -lt "$attempts" ]; then sleep 10; fi
            done
            echo "GET ${ORIGIN}${missing} -> ${code}"
            if [ "$code" != "404" ]; then
              echo "Smoke check failed: ${missing} returned ${code}, expected 404" >&2
              status=1
            fi
          done
          exit $status
      # NO HC.io /fail step here (deploy-prod.yml has one): the only check is the
      # PROD dead-man's-switch, and a staging-only deploy failure must not page the
      # prod alert channel — a red Actions run is the right signal for dev
      # (PR #305 review).
