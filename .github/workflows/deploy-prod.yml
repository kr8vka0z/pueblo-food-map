# PROD deploy via GitHub Actions robot. REPLACES Cloudflare Workers Builds.
# Workers Builds MUST be disconnected on the pueblo-food-map Worker (CF
# dashboard -> Workers & Pages -> pueblo-food-map -> Settings -> Builds)
# BEFORE the first main push after this workflow merges, or a push to main
# will double-deploy (Workers Builds AND this workflow both firing on the
# same push).
#
# Deploys the TOP-LEVEL wrangler.jsonc config (prod worker `pueblo-food-map`,
# route pueblofoodmap.com) via opennextjs-cloudflare build + deploy (no
# --env) — the repo's documented manual deploy path (AGENTS.md "Build and
# preview locally"). A functional superset of Workers Builds' bare
# `npx wrangler deploy` (adds OpenNext's cache-populate step). Gated by
# the same `predeploy` suite ci.yml runs (lint, design:drift, typecheck,
# test) — a red build must never reach production. Mirrors deploy-dev.yml's
# structure and pinned-action SHAs (matches the pattern proven in
# ToastHoster's deploy-prod.yml/deploy-dev.yml) so prod and dev stay easy to
# diff against each other.
#
# NOT included: a D1 remote-migrate step. AGENTS.md's "Applying the
# migration — NOT part of a Worker deploy" section documents prod D1
# migration as a manual step run separately at merge time
# (`npx wrangler d1 migrations apply pueblo-food-map-admin --remote`) — this
# workflow reproduces that existing behavior exactly rather than inventing a
# migration step Workers Builds never had either.
#
# Build-time NEXT_PUBLIC_* vars: `next build` inlines these into the client
# bundle at BUILD time, not runtime (AGENTS.md "Environment variables — two
# kinds, two places"). Workers Builds ran this build inside Cloudflare's own
# environment, where its Build variables live; moving the build onto a
# GitHub runner means these values must come from GH secrets instead, or the
# deployed bundle ships with an undefined Mapbox token (blank "not
# authorized" map) and an undefined Turnstile sitekey (forms' bot-check
# widget fails to render). Two NEW secrets must exist BEFORE this workflow's
# first prod run: NEXT_PUBLIC_MAPBOX_TOKEN (the real production-scoped
# public token — see AGENTS.md "Mapbox Token Management") and
# NEXT_PUBLIC_TURNSTILE_SITE_KEY (see .env.example).
name: Deploy Prod

on:
  push:
    branches: [main]
  # Recovery hatch. Without this there is no way to deploy `main` except by
  # pushing another commit, so any commit that reaches `main` without firing
  # this workflow can only be rescued by manufacturing an empty commit. Lets a
  # stranded `main` be deployed as-is from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Predeploy checks, deploy (prod, top-level config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Consumed by `next build` inside `npm run deploy` below — see the
      # file-header comment on why these must be GH secrets now.
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      # Same pinned-SHA third-party actions as deploy-dev.yml — a mutable
      # tag could be repointed to malicious code; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, not ci.yml's 20: wrangler >=4.x refuses to run on Node <22
          # (hard version check at startup, observed in run 29660459443).
          # Matches ToastHoster's deploy workflows.
          node-version: 22
          cache: npm
      - run: npm ci
      # Same gate deploy-dev.yml and ci.yml run — a broken build must never
      # reach production either.
      - run: npm run predeploy
      # No --env: resolves the top-level wrangler.jsonc config (prod worker
      # `pueblo-food-map`, route pueblofoodmap.com). Do not add --env here.
      # Raw CLI, not `npm run deploy`: npm auto-fires the `predeploy` script
      # as a lifecycle pre-hook of `deploy`, which would re-run the explicit
      # gate step above (~3 min duplicated inside the 15-min timeout).
      - run: npx opennextjs-cloudflare build
      - run: npx opennextjs-cloudflare deploy
      # Post-deploy smoke check. AGENTS.md's "Per-venue pages" section
      # states the lesson this codifies: "a green build / CF-check does
      # NOT prove the page works on this stack" (learned 2026-06-20, a
      # `redirects()` rule that built clean and passed CI 500'd the live
      # homepage) — that lesson was never automated until now. Curls the
      # direct Worker origin (bypasses the zone/CDN cache, per AGENTS.md
      # "Direct Worker URL") for the homepage, the venues directory, and
      # one real per-venue page. The 10-day 2026-08-24 to 2026-09-02
      # outage (218/230 public URLs 404ing) is exactly the class of
      # failure this would have caught on deploy #1 instead of deploy #19.
      - name: Smoke test production (post-deploy)
        run: |
          set -e
          ORIGIN="https://pueblo-food-map.kyle-boyd.workers.dev"
          VENUE_ID=$(grep -m1 '"id":' src/data/published-venues.ts | sed -E 's/.*"id": *"([^"]+)".*/\1/')
          if [ -z "$VENUE_ID" ]; then
            echo "Smoke check failed: could not read a venue id from src/data/published-venues.ts" >&2
            exit 1
          fi
          # RETRY, because `wrangler deploy` returning is not the same as the new
          # version serving. Its first run (2026-09-03) went red against a
          # deployment that was in fact correct: `/` and `/venues` answered 200
          # while `/venue/<id>` still 404'd, and the same URL served 200 a couple
          # of minutes later with nothing redeployed in between. Static assets —
          # which is where the prerendered venue pages now live, see
          # open-next.config.ts — become reachable slightly after the Worker
          # itself does. Without a retry this step reports every good deploy as a
          # failure, and a check that cries wolf gets deleted, taking the real
          # signal with it.
          #
          # Deliberately NOT curl's own --retry: that retries a connection-level
          # failure, not a well-formed 404, which is exactly the shape here.
          #
          # ponytail: fixed 10s x 6 rather than exponential backoff — one minute
          # covers the propagation observed by a wide margin. If a deploy ever
          # legitimately needs longer, raise the attempt count; do not weaken the
          # assertion to a warning.
          attempts=6
          status=0
          for path in "/" "/venues" "/venue/${VENUE_ID}"; do
            code=""
            for i in $(seq 1 "$attempts"); do
              # No -f: a 404 must be READ, not turned into a curl error. `-f`
              # suppresses the body AND exits non-zero, which previously
              # concatenated with the fallback and printed the nonsense "404000".
              code=$(curl -sS -o /dev/null -w "%{http_code}" "${ORIGIN}${path}" || echo "000")
              [ "$code" = "200" ] && break
              if [ "$i" -lt "$attempts" ]; then
                echo "GET ${ORIGIN}${path} -> ${code} (attempt ${i}/${attempts}, retrying in 10s)"
                sleep 10
              fi
            done
            echo "GET ${ORIGIN}${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "Smoke check failed: ${path} returned ${code}, expected 200" >&2
              status=1
            fi
          done
          exit $status
      # Belt and suspenders on top of the HC.io dead-man's-switch (wrangler.jsonc
      # `triggers`/`vars`, custom-worker.ts `scheduled()`): that switch only fires on
      # SILENCE (no ping within period+grace). A failed deploy here pushes an explicit
      # red into the SAME check immediately instead of waiting up to 5+3 min for the
      # next missed heartbeat — https://hc-ping.com/<uuid>/fail is Healthchecks.io's
      # documented explicit-failure endpoint. Runs regardless of which prior step
      # failed; never blocks/masks the real failure (curl exit code is not checked
      # against the job's own status).
      - name: Notify Healthchecks.io of deploy failure
        if: failure()
        run: curl -fsS --retry 3 "${{ secrets.HC_PING_URL }}/fail"
