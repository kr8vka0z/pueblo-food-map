# PROD deploy via GitHub Actions. Cloudflare Workers Builds must stay
# disconnected on the pueblo-food-map Worker (CF dashboard -> Workers & Pages
# -> pueblo-food-map -> Settings -> Builds), or a push to main double-deploys
# (Workers Builds AND this workflow both firing on the same push). AGENTS.md
# "Hosting and deploys".
#
# Deploys the TOP-LEVEL wrangler.jsonc config (prod worker `pueblo-food-map`,
# route pueblofoodmap.com) via `vite build` (vinext), which flattens the
# top-level config into dist/server/wrangler.json, then a plain
# `npx wrangler deploy` (no --env). Gated by lint, design:drift and typecheck
# here; the full test suite already ran as the PR's required ci.yml check.
# Mirrors deploy-dev.yml's structure and pinned-action SHAs so prod and dev
# stay easy to diff against each other.
#
# NOT included: a D1 remote-migrate step. Prod D1 migration is a manual step
# run separately before the release merge (AGENTS.md "Promotion checklist —
# D1 migrations"); this workflow deliberately has no migration step.
#
# Build-time NEXT_PUBLIC_* vars: `vite build` (vinext) inlines these into the client
# bundle at BUILD time, not runtime, and the build runs on the GitHub runner,
# so the values must be GitHub Actions secrets (AGENTS.md "Secrets"), or the
# deployed bundle ships with an undefined Mapbox token (blank "not
# authorized" map) and an undefined Turnstile sitekey (forms' bot-check
# widget fails to render). Required: NEXT_PUBLIC_MAPBOX_TOKEN (the
# production-scoped public token) and NEXT_PUBLIC_TURNSTILE_SITE_KEY (see
# .env.example).
#
# NEXT_PUBLIC_TURNSTILE_BOX_SITE_KEY: a third build secret, the
# invisible-mode key blessing-box check-ins verify against instead of the
# managed-mode key above. Missing it degrades the same way a missing
# NEXT_PUBLIC_TURNSTILE_SITE_KEY does — the check-in widget fails to render —
# never a build failure.
name: Deploy Prod

on:
  push:
    branches: [main]
  # Recovery hatch. Without this there is no way to deploy `main` except by
  # pushing another commit, so any commit that reaches `main` without firing
  # this workflow can only be rescued by manufacturing an empty commit. Lets a
  # stranded `main` be deployed as-is from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Predeploy checks, deploy (prod, top-level config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Consumed by `vite build` below (vinext inlines NEXT_PUBLIC_*) — see the
      # file-header comment on why these must be GH secrets now.
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_TURNSTILE_BOX_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_BOX_SITE_KEY }}
      # #485 (PostHog analytics) — same as deploy-dev.yml: empty/unset
      # POSTHOG_PROJECT_KEY is a supported no-op (analytics.ts's
      # initAnalytics() loads nothing without a key), never a build failure.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
    steps:
      # Same pinned-SHA third-party actions as deploy-dev.yml — a mutable
      # tag could be repointed to malicious code; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22 (same as ci.yml, shared cache): wrangler >=4.x refuses to run on Node <22
          # (hard version check at startup, observed in run 29660459443).
          # Matches ToastHoster's deploy workflows.
          node-version: 22
          cache: npm
      # Reuse node_modules when the lockfile is unchanged (see ci.yml).
      - id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci
      # Fast gate only. The full test suite is NOT re-run here: nothing lands
      # on `main` without a PR whose required "Lint, typecheck, build" check
      # (ci.yml, full suite) passed — ruleset 17480895. Re-running it cost ~3
      # min per deploy and let a flaky test block an already-green change.
      - run: npm run lint && npm run design:drift && npm run typecheck
      # No CLOUDFLARE_ENV: the build flattens the top-level wrangler.jsonc config
      # (prod worker `pueblo-food-map`, route pueblofoodmap.com) into
      # dist/server/wrangler.json, and `wrangler deploy` finds it through
      # .wrangler/deploy/config.json. Do not add --env or CLOUDFLARE_ENV here.
      - run: npx vite build
      - run: npx wrangler deploy
      # Post-deploy smoke check (scripts/smoke.sh: what it checks and why), against
      # the direct Worker origin, which bypasses the zone/CDN cache and Bot Fight
      # Mode. --canonical-host adds the prod-only check that pueblofoodmap.com
      # itself never sends noindex.
      - name: Smoke test production (post-deploy)
        run: bash scripts/smoke.sh "https://pueblo-food-map.kyle-boyd.workers.dev" --canonical-host pueblofoodmap.com
      # Belt and suspenders on top of the HC.io dead-man's-switch (wrangler.jsonc
      # `triggers`/`vars`, custom-worker.ts `scheduled()`): that switch only fires on
      # SILENCE (no ping within period+grace). A failed deploy here pushes an explicit
      # red into the SAME check immediately instead of waiting up to 5+3 min for the
      # next missed heartbeat — https://hc-ping.com/<uuid>/fail is Healthchecks.io's
      # documented explicit-failure endpoint. Runs regardless of which prior step
      # failed; never blocks/masks the real failure (curl exit code is not checked
      # against the job's own status).
      - name: Notify Healthchecks.io of deploy failure
        if: failure()
        run: curl -fsS --retry 3 "${{ secrets.HC_PING_URL }}/fail"

  # Release bookkeeping (AGENTS.md "Release schedule"). Two separate jobs, both
  # gated on the deploy so a red deploy never gets a tag or a sync, and NOT on
  # each other: a failed sync must not be skipped by a re-run just because the
  # release already exists, and vice versa. Each job's own check makes it
  # idempotent, so a re-run only redoes what is missing.
  #
  # Both use an App token for their writes (job token stays read-only): objects
  # created with GITHUB_TOKEN start no workflows (#367), so a sync PR opened
  # with it would never get CI and auto-merge would wait forever.
  release:
    name: Tag and publish GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version in package.json names the release. A push that doesn't
      # change it (a publish-bot venue-data merge) finds its release already
      # there and does nothing; only a release/hotfix merge bumps the version.
      # `--target` pins the tag to the commit that was just deployed, so a
      # later push to main can't move where vX.Y.Z points.
      - name: Create tag and GitHub Release if missing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released; nothing to do."
            exit 0
          fi
          bash scripts/release/section.sh "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" \
            --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"

      # prepare.mjs starts the next release's notes at the newest cut/* tag, so
      # that tag must mean "this dev commit went live". Writing it here, after a
      # good deploy, keeps a cut that never merged inside the next notes. The
      # release lands as a squash, so the dev commit comes from the merged PR:
      # the merge base of its head and dev is the commit it was cut from.
      # Hotfixes and publish-bot get no cut tag: they don't come from dev.
      # POST, then PATCH: a re-run finds the tag already there.
      - name: Record the dev commit that went live
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq \
            '[.[] | select(.base.ref == "main" and .merged_at != null and (.head.ref | startswith("release/")))][0] // empty | "\(.head.ref) \(.head.sha)"')
          if [ -z "$pr" ]; then echo "Not a release merge; no cut tag."; exit 0; fi
          read -r ref head <<<"$pr"
          cut=$(gh api "repos/$REPO/compare/dev...$head" --jq .merge_base_commit.sha)
          tag="cut/${ref#release/}"
          gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$cut" >/dev/null \
            || gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f "sha=$cut" -F force=true >/dev/null
          echo "$tag -> $cut"

  # main -> dev sync, after ANY push to main (release, hotfix, publish-bot).
  # Release/hotfix PRs reach main as SQUASH commits (main's ruleset requires
  # linear history), so main's history and dev's diverge; without a real merge
  # commit the next release PR conflicts on everything main changed. A merge
  # commit into dev makes main's tip an ancestor of dev again. It also carries
  # a hotfix's code and the venue data publish-bot put on main to staging, and
  # brings the version bump + changelog — one mechanism for all three.
  #
  # Uses a branch at main's tip rather than `main` itself as the PR head:
  # "delete head branch on merge" must never be able to point at main.
  # Decided from the compare API, so no checkout or history fetch is needed:
  # "behind"/"identical" = main is already an ancestor of dev.
  sync-dev:
    name: Sync main into dev
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Open auto-merging sync PR if dev lacks main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$REPO/compare/dev...$GITHUB_SHA" --jq .status)
          case "$status" in
            behind|identical) echo "dev already contains this main commit ($status)."; exit 0 ;;
          esac
          branch="sync/main-${GITHUB_SHA:0:7}"
          # Re-run safe: reuse the branch and any PR already open for it.
          gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1 \
            || gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$GITHUB_SHA" >/dev/null
          url=$(gh pr list --repo "$REPO" --base dev --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --repo "$REPO" --base dev --head "$branch" \
              --title "chore(release): sync main into dev (${GITHUB_SHA:0:7})" \
              --body "Automatic. Merges what reached main (release, hotfix or venue publish) back into dev with a merge commit so the two branches share history again. Do not squash.")
          fi
          gh pr merge --auto --merge "$url"
