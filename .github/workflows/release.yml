# Release cut: nothing starts this on a timer. When Kyle says "cut the release",
# an agent dispatches it. It opens a `Release vX.Y.Z` PR from `dev` into `main`,
# or updates the open one in place, and squash-merging that PR (main requires
# linear history) deploys prod via deploy-prod.yml, which then tags, publishes
# the GitHub Release, records the cut tag, and opens the main -> dev sync PR.
# Process + rules: AGENTS.md "Release schedule".
#
# WHY every push/PR here uses a GitHub App token, not GITHUB_TOKEN: pushes and
# PRs made with the built-in token deliberately fire no workflows (#367), so
# the release PR would sit with no CI and could never satisfy the required
# checks. The App is the one dependabot-auto-merge.yml already uses; its
# RELEASE_PLEASE_APP_* secret names are historical.
#
# WHY an edit here takes effect only after it reaches `main`: GitHub runs
# `workflow_dispatch` only from the default branch's copy of a workflow. If a
# run fails, cut the release by hand (AGENTS.md "Manual cut"). It always checks
# out `dev` on purpose: a dispatched run's default checkout would be `main`.
name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Force this version (X.Y.Z). Empty = computed. Use for a major bump."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # the PR body names the latest Deploy Dev run
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          # Full history, every branch and tag: decide.mjs compares origin/main
          # and reads the release branch; prepare.mjs lists `<latest cut tag>..dev`.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Rules and their reasons live in decide.mjs (tested in decide.test.mjs).
      # Red when blocked, so a release that didn't happen never looks green.
      - name: Decide what this cut does
        id: decide
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FORCE_VERSION: ${{ inputs.version }}
        run: node scripts/release/decide.mjs

      # --dry-run: only picks the version and writes the PR list. The version
      # bump happens AFTER the model step so the model can't touch package files.
      # Exit 3 = no PRs since the last release, but decide.mjs saw different
      # files, so something reached dev outside a PR. That is not "no changes".
      - name: Compute version and PR list
        id: prep
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FORCE_VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set +e
          args=(--dry-run --out "$GITHUB_WORKSPACE/.release-prs.md")
          [ -z "$FORCE_VERSION" ] || args+=(--version "$FORCE_VERSION")
          node scripts/release/prepare.mjs "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "::error::Release NOT cut: dev and main hold different files but no PR is listed since the last release. Compare them with git diff."
            exit 1
          fi
          [ "$rc" = "0" ] || exit "$rc"
          echo "date=$(TZ=America/Denver date +%F)" >> "$GITHUB_OUTPUT"

      # The changelog voice leaves dependency and CI work out, so the model
      # would write an empty section and section.sh would fail the run, then
      # the GitHub Release. Maintenance-only releases still count, so they get
      # this fixed line and skip the model.
      - name: Write maintenance-only changelog section
        if: steps.decide.outputs.maintenance == 'true'
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          DATE: ${{ steps.prep.outputs.date }}
        run: |
          printf '\n## [%s] - %s\n\n### Improved\n\n- Maintenance only: dependency and build updates, nothing visitors will notice.\n' \
            "$VERSION" "$DATE" > "$RUNNER_TEMP/maintenance.md"
          sed -i "/^## \[Unreleased\]/r $RUNNER_TEMP/maintenance.md" CHANGELOG.md

      # The PR-list file sits in the workspace (not RUNNER_TEMP) so the model's
      # Read tool can reach it; it is gitignored and never committed.
      #
      # github_token: without it the action mints its own token and revokes it
      # at the end, which would also kill the push credential checkout stored.
      # allowed_bots "*": a dispatch can come from a bot, which the action
      # otherwise refuses. Safe here because this workflow has no issue/PR
      # trigger an outsider could use to feed the model a prompt.
      #
      # Tools are scoped because checkout leaves the App token in .git/config
      # (extraheader): the model gets Read plus Edit on CHANGELOG.md only, no
      # Bash, and is denied .git explicitly. Both `.git/**` and `./.git/**`
      # spellings are listed since path-rule anchoring differs by version. The
      # push-target check, credential grep and "only CHANGELOG.md changed"
      # checks in the next step are the backstop if a rule is wrong.
      #
      # WHY there is no hash check on .git/config: the action itself rewrites
      # it before the model starts (sets the git user, swaps checkout's
      # credential for its own), so a before/after hash fails on every run.
      # That check blocked the first scheduled cut (2026-10-04).
      - name: Write changelog section
        if: steps.decide.outputs.run == 'true' && steps.decide.outputs.maintenance != 'true'
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "*"
          prompt: |
            Write the CHANGELOG.md entry for release v${{ steps.prep.outputs.version }}.

            Input: ${{ steps.prep.outputs.prs_file }} lists every PR merged since the last release (title + description).

            Edit CHANGELOG.md: insert ONE new section directly below the
            `## [Unreleased]` heading (leave that heading and an empty body
            for it), headed exactly:
              ## [${{ steps.prep.outputs.version }}] - ${{ steps.prep.outputs.date }}

            Audience: food-bank partners and the public, not developers. Plain
            language, no jargon (no "refactor", "API", "endpoint", "D1", file
            or component names).

            Use only these subheadings, and skip any that would be empty:
              ### New        (something visitors or admins can now do)
              ### Improved   (something that got better, faster, clearer)
              ### Fixed      (something that was broken and works now)

            One short sentence per bullet saying what a visitor or admin will
            notice. End each bullet with the PR link, like
            `([#123](https://github.com/${{ github.repository }}/pull/123))`.
            Merge PRs about the same thing into one bullet with all its links.

            Leave out dependency bumps, CI, docs, tests and refactors unless a
            visitor or admin can notice the difference. Roll every security
            update into ONE bullet under Improved: "Security updates."

            Edit only CHANGELOG.md. Do not run git.
          claude_args: |
            --allowedTools "Read,Edit(CHANGELOG.md)"
            --disallowedTools "Read(.git/**),Read(./.git/**),Edit(.git/**),Edit(./.git/**),Bash"

      - name: Open or update release PR
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Reads the Deploy Dev run; this job's token has actions: read.
          RUNS_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          ACTION: ${{ steps.decide.outputs.action }}
          PR_NUMBER: ${{ steps.decide.outputs.pr_number }}
        run: |
          set -euo pipefail
          # The push below carries a repo-write token, so prove it still goes
          # to this repo (tested in check-push-target.test.mjs).
          bash scripts/release/check-push-target.sh "$GITHUB_REPOSITORY"
          if grep -Eq 'x-access-token|ghs_|ghp_|github_pat_' CHANGELOG.md; then
            echo "CHANGELOG.md contains something that looks like a credential" >&2
            exit 1
          fi
          # The model may change CHANGELOG.md and nothing else. Anything more
          # (or nothing at all) fails the run rather than shipping a surprise.
          if [ "$(git status --porcelain)" != " M CHANGELOG.md" ]; then
            echo "Expected exactly CHANGELOG.md to be modified; got:" >&2
            git status --porcelain >&2
            exit 1
          fi
          bash scripts/release/section.sh "$VERSION" > "$RUNNER_TEMP/section.md"

          npm version "$VERSION" --no-git-tag-version --allow-same-version

          git config user.name "pueblo-release-bot"
          git config user.email "pueblo-release-bot@users.noreply.github.com"
          CUT_SHA=$(git rev-parse HEAD)
          git switch -c "release/v$VERSION"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          # Force: this branch is rebuilt from dev on every cut, either over a
          # closed PR's leftover branch or to update the open PR in place. The
          # push reruns the PR's checks.
          git push --force origin "release/v$VERSION"

          repo_url="https://github.com/$GITHUB_REPOSITORY"
          read -r deployed_sha deployed_url < <(GH_TOKEN="$RUNS_TOKEN" gh run list --workflow deploy-dev.yml --branch dev \
            --status success --limit 1 --json headSha,url --jq '.[0] | "\(.headSha) \(.url)"' || true) || true
          if [ "${deployed_sha:-}" = "$CUT_SHA" ]; then
            deployment="[Deploy Dev]($deployed_url) succeeded on this commit."
          elif [ -n "${deployed_sha:-}" ]; then
            deployment="**This commit is not on the dev site yet.** The latest successful [Deploy Dev]($deployed_url) was \`${deployed_sha:0:7}\`."
          else
            deployment="Unknown: the latest Deploy Dev run could not be read."
          fi

          {
            echo "## What is changing"
            echo
            cat "$RUNNER_TEMP/section.md"
            cat <<EOF

          ## Where it stands
          - Dev site: https://dev.pueblofoodmap.com
          - Cut from commit: [\`${CUT_SHA:0:7}\`]($repo_url/commit/$CUT_SHA)
          - Dev deployment at that moment: $deployment

          ## Pre-release checks
          The agent marks each one Passed or Failed. Anything not checked stays Unknown.
          - Unknown: a clean Codex review on every PR in this release
          - Unknown: production database changes applied (AGENTS.md "Promotion checklist")
          - Unknown: production secrets, flags and outside-service settings checked on production
          - Unknown: a checkout walked on this build, if the payment path changed
          - Unknown: the rollback steps in AGENTS.md "Rollback" still fit this release

          ## How to undo
          In the Cloudflare dashboard, open the pueblo-food-map Worker, go to Deployments and roll back to the previous build. Then open a revert PR into dev, or the next push to main brings the bad code back. A rollback does not undo production database changes. Full steps: AGENTS.md "Rollback".

          Squash-merging this PR deploys production and publishes the GitHub Release.
          EOF
          } > "$RUNNER_TEMP/body.md"

          # REST, not `gh pr edit`: that command also reads project fields an
          # App token may not be allowed to see.
          if [ "$ACTION" = "update" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              -f "title=Release v$VERSION" -F "body=@$RUNNER_TEMP/body.md" >/dev/null
            url="$repo_url/pull/$PR_NUMBER"
          else
            url=$(gh pr create --base main --head "release/v$VERSION" \
              --title "Release v$VERSION" --body-file "$RUNNER_TEMP/body.md")
          fi
          echo "Release v$VERSION ready, cut from ${CUT_SHA:0:7}: $url" | tee -a "$GITHUB_STEP_SUMMARY"
