# Supply-chain / secret / SAST sweep of this repo — runs on every PR into
# main/dev (so it can gate merges) and weekly on a schedule.
#
# WHY both triggers: a PR run only ever sees the dependency graph and code as
# of that diff. A CVE published against a dependency this repo already
# shipped needs a second, independent trigger that fires on the world's
# schedule, not just on pushes — that's the failure the cron catches that
# PR-time scanning cannot. Required-check enforcement is a separate, later
# decision — this PR only makes the checks exist to be required.
name: Weekly Security Audit

on:
  pull_request:
    branches: [main, dev]
  schedule:
    # Runs every Sunday at 06:00 UTC (12:00 AM MST)
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  semgrep-sast:
    name: SAST Code Analysis (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default p/owasp-top-ten p/security-code-scan
        env:
          SEMGREP_SEND_METRICS: "off"

  secret-scan:
    name: Secret Leak Scan (TruffleHog)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --only-verified

  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow clone -- the data-only
          # detection step below diffs base...head by SHA (#336).
          fetch-depth: 0

      - name: Detect data-only publish-bot PR
        id: detect
        # Same diff-scope guard as ci.yml's "Lint, typecheck, build" job --
        # duplicated rather than shared, since GitHub Actions has no
        # cross-workflow step-output reuse. A branch-name check ALONE would
        # be unsafe (anything pushed to a branch literally named
        # "publish-bot" would silently skip the CVE gate); the real safety
        # property is the DIFF -- data_only=true only when the PR is really
        # publish-bot -> main/dev, from this repo (not a fork), AND its full
        # base...head diff touches EXACTLY the one generated file the
        # publish engine writes (src/lib/publishVenues.ts, AGENTS.md
        # "Publish -> static") (#336).
        #
        # Diffed from the MERGE-BASE of base/head, not a raw two-dot diff
        # (PR review on #383) -- see ci.yml's matching step for the full WHY:
        # a two-dot diff only equals "this PR's change" when base.sha is
        # exactly head's parent, and a lagging base.sha on a `synchronize`
        # event (or main/dev advancing between bot-branch reset and this run)
        # makes it show base's own commits as reversed changes, breaking
        # data_only exactly when the publish carve-out needs to hold. This
        # job's checkout above already uses fetch-depth: 0, which merge-base
        # needs to resolve.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          data_only=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REF" = "publish-bot" ] && [ "$IS_FORK" = "false" ]; then
            changed="$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")"
            if [ "$changed" = "src/data/published-venues.ts" ]; then
              data_only=true
            fi
          fi
          echo "data_only=$data_only" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Full-tree audit is informational only: build tooling never ships to
      # production, so a CVE here shouldn't block a merge. It still runs and
      # posts to the job summary — reported, not silenced — so a build-tool
      # CVE stays visible instead of vanishing when the blocking step below is
      # scoped down. Deliberate split, not a loosened check. Also runs
      # unconditionally for a data-only publish PR (#336) -- a build-tool CVE
      # stays visible on every run, publish included, even on the run that
      # skips the blocking step below.
      - name: Full dependency audit (informational, build tooling included)
        run: |
          echo "### Full dependency audit (informational — includes build tooling, does not block)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run NPM Dependency Audit (production only, blocking)
        # Skipped for a data-only publish PR (#336) -- same reasoning as
        # ci.yml's "npm audit (production deps, high/critical only)" step: a
        # newly-published CVE against an unrelated transitive dependency
        # must not block real venue data from reaching the live map. The CVE
        # is still reported (the informational step above, this same job,
        # every run) and still enforced on every non-publish PR and by this
        # workflow's own weekly cron regardless of whether a PR is ever
        # opened. This job must still run and report green on a data-only
        # PR -- it's a required check by its literal name ("Dependency CVE
        # Audit"), so a job-level `if:` here would leave the PR blocked
        # forever instead of passing; only this one step is conditional.
        if: steps.detect.outputs.data_only != 'true'
        run: |
          echo "### Production dependency audit" >> $GITHUB_STEP_SUMMARY
          if npm audit --audit-level=high --omit=dev; then
            echo "No high/critical CVEs found in production dependencies." >> $GITHUB_STEP_SUMMARY
          else
            echo "High or critical vulnerability detected in production dependencies." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Skipped — data-only publish PR
        # Job-summary breadcrumb explaining why the blocking step above is
        # absent from this run's log, so a green "Dependency CVE Audit"
        # check on a publish PR doesn't read as "nothing ran" (#336).
        if: steps.detect.outputs.data_only == 'true'
        run: |
          echo "### Production dependency audit — skipped" >> $GITHUB_STEP_SUMMARY
          echo "This PR is a data-only publish-bot PR (touches only src/data/published-venues.ts). The blocking production-CVE check is scoped out for data-only publishes — see ci.yml/weekly-security-audit.yml comments (#336). The full informational audit above still ran." >> $GITHUB_STEP_SUMMARY
