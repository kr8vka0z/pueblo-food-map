<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a box's status changes · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FBFAF6;
      --color-ink:     #2D2A26;
      --color-muted:   #5F5A52;
      --color-accent:  #2C5F4F;
      --font-sans:     'Public Sans', system-ui, -apple-system, sans-serif;
      --font-serif:    'Fraunces', Georgia, serif;
      --font-mono:     ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .note {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Blessing Boxes</p>
    <h1>How a box's status changes</h1>

    <svg viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="box-status-title box-status-desc">
      <title id="box-status-title">How a box's status changes</title>
      <desc id="box-status-desc">State machine showing a Blessing Box moving between Unknown, Stocked, Running low and Empty based on the latest check-in, fading back to Unknown after a week of silence, and moving to Out of service when an admin pauses it or confirms damage.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5A52"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2C5F4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF6"/>

      <!-- Transitions (drawn before states) -->
      <!-- Start -> Unknown -->
      <line x1="68" y1="200" x2="110" y2="200" stroke="#5F5A52" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Unknown -> Stocked (coral, the happy signal) -->
      <line x1="270" y1="200" x2="350" y2="200" stroke="#2C5F4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="284" y="184" width="52" height="12" rx="2" fill="#FBFAF6"/>
      <text x="310" y="194" fill="#2C5F4F" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FILLED</text>

      <!-- Stocked -> Running low -->
      <line x1="510" y1="200" x2="590" y2="200" stroke="#5F5A52" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="512" y="184" width="76" height="12" rx="2" fill="#FBFAF6"/>
      <text x="550" y="194" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RUNNING LOW</text>

      <!-- Running low -> Empty -->
      <line x1="750" y1="200" x2="830" y2="200" stroke="#5F5A52" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="756" y="184" width="48" height="12" rx="2" fill="#FBFAF6"/>
      <text x="780" y="194" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EMPTY</text>

      <!-- Out of service -> Unknown (reopen), dashed, left+up elbow -->
      <path d="M 520,320 V 288 Q 520,280 512,280 H 198 Q 190,280 190,272 V 240" fill="none" stroke="#5F5A52" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="322" y="266" width="56" height="12" rx="2" fill="#FBFAF6"/>
      <text x="350" y="276" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REOPEN</text>

      <!-- Start dot -->
      <circle cx="60" cy="200" r="6" fill="#2D2A26"/>

      <!-- State: Unknown -->
      <rect x="110" y="160" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <rect x="118" y="168" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,42,38,0.40)" stroke-width="0.8"/>
      <text x="144" y="177" fill="#2D2A26" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS</text>
      <text x="190" y="208" fill="#2D2A26" font-size="14" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Unknown</text>
      <text x="190" y="224" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">no recent check-ins</text>

      <!-- State: Stocked (focal, coral) -->
      <rect x="350" y="160" width="160" height="80" rx="8" fill="rgba(44,95,79,0.08)" stroke="#2C5F4F" stroke-width="1"/>
      <rect x="358" y="168" width="52" height="12" rx="2" fill="transparent" stroke="rgba(44,95,79,0.50)" stroke-width="0.8"/>
      <text x="384" y="177" fill="#2C5F4F" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS</text>
      <text x="430" y="208" fill="#2D2A26" font-size="14" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Stocked</text>
      <text x="430" y="224" fill="#2C5F4F" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">someone just filled it</text>

      <!-- State: Running low -->
      <rect x="590" y="160" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <rect x="598" y="168" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,42,38,0.40)" stroke-width="0.8"/>
      <text x="624" y="177" fill="#2D2A26" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS</text>
      <text x="670" y="208" fill="#2D2A26" font-size="14" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Running low</text>
      <text x="670" y="224" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">getting empty</text>

      <!-- State: Empty -->
      <rect x="830" y="160" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <rect x="838" y="168" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,42,38,0.40)" stroke-width="0.8"/>
      <text x="864" y="177" fill="#2D2A26" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS</text>
      <text x="910" y="208" fill="#2D2A26" font-size="14" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Empty</text>
      <text x="910" y="224" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">needs a fill</text>

      <!-- State: Out of service -->
      <rect x="400" y="320" width="240" height="68" rx="8" fill="rgba(45,42,38,0.05)" stroke="#5F5A52" stroke-width="1"/>
      <rect x="408" y="328" width="52" height="12" rx="2" fill="transparent" stroke="rgba(95,90,82,0.50)" stroke-width="0.8"/>
      <text x="434" y="337" fill="#5F5A52" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS</text>
      <text x="520" y="360" fill="#2D2A26" font-size="14" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Out of service</text>
      <text x="520" y="376" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">paused · hidden from closest-box</text>

      <!-- Annotations (italic serif, max 2) -->
      <text x="60" y="440" class="note" fill="#5F5A52">* "Filled" always moves a box to Stocked, from any active status — not only from Unknown.</text>
      <text x="60" y="462" class="note" fill="#5F5A52">* No check-in for 7 days fades Stocked / Low / Empty back to Unknown. An admin pause or confirmed damage sends any status to Out of service.</text>

      <!-- Legend -->
      <line x1="40" y1="482" x2="1040" y2="482" stroke="rgba(45,42,38,0.10)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <circle cx="207" cy="491" r="4" fill="#2D2A26"/>
      <text x="220" y="496" fill="#5F5A52" font-size="8.5" font-family="'Public Sans', sans-serif">New box</text>

      <rect x="300" y="488" width="14" height="10" rx="2" fill="rgba(44,95,79,0.08)" stroke="#2C5F4F" stroke-width="1"/>
      <text x="320" y="496" fill="#5F5A52" font-size="8.5" font-family="'Public Sans', sans-serif">Desired status</text>

      <line x1="460" y1="493" x2="488" y2="493" stroke="#5F5A52" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="496" y="496" fill="#5F5A52" font-size="8.5" font-family="'Public Sans', sans-serif">Admin action</text>
    </svg>
  </div>
</body>
</html>
