<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopting a Box and Getting Alerted · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FBFAF6;   /* bone50 */
      --color-ink:     #2D2A26;   /* ink700 */
      --color-muted:   #5F5A52;   /* ink500 */
      --color-accent:  #2C5F4F;   /* sage600 */
      --font-sans:     'Public Sans', system-ui, -apple-system, sans-serif;
      --font-serif:    'Fraunces', Georgia, serif;
      --font-mono:     ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1440px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .note {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Blessing Boxes</p>
    <h1>Who Adopts a Box, and Who Gets Told</h1>

    <svg viewBox="0 0 1400 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adopt-alerts-title adopt-alerts-desc">
      <title id="adopt-alerts-title">Who adopts a box, and who gets told</title>
      <desc id="adopt-alerts-desc">Swimlane diagram showing a group adopting a box through admin approval (any admin, no separate reviewer role, every action logged against who did it and when), a giver signing up for alerts with an email they must confirm, and how an anonymous empty-box report triggers rate-capped emails through Resend to the box's host, its adopters, and confirmed nearby sign-ups, each with a one-click stop link.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F5A52"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2C5F4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF6"/>

      <!-- Lane dividers -->
      <line x1="40" y1="72" x2="1360" y2="72" stroke="rgba(45,42,38,0.22)" stroke-width="1"/>
      <line x1="40" y1="172" x2="1360" y2="172" stroke="rgba(45,42,38,0.10)" stroke-width="1"/>
      <line x1="40" y1="272" x2="1360" y2="272" stroke="rgba(45,42,38,0.10)" stroke-width="1"/>
      <line x1="40" y1="372" x2="1360" y2="372" stroke="rgba(45,42,38,0.10)" stroke-width="1"/>
      <line x1="40" y1="472" x2="1360" y2="472" stroke="rgba(45,42,38,0.22)" stroke-width="1"/>

      <!-- Actor label column divider -->
      <line x1="170" y1="72" x2="170" y2="472" stroke="rgba(45,42,38,0.22)" stroke-width="1"/>

      <!-- Zone dividers (dashed, decorative — separate the three sub-processes) -->
      <line x1="628" y1="72" x2="628" y2="472" stroke="rgba(45,42,38,0.15)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="868" y1="72" x2="868" y2="472" stroke="rgba(45,42,38,0.15)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Zone headers -->
      <text x="400" y="54" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ADOPT A BOX</text>
      <text x="745" y="54" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ALERTS SIGN-UP</text>
      <text x="1005" y="54" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">WHEN A BOX GOES EMPTY</text>

      <!-- Lane labels -->
      <text x="60" y="126" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.16em">PERSON</text>
      <text x="60" y="226" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.16em">WEBSITE</text>
      <text x="60" y="326" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.16em">ADMIN</text>
      <text x="60" y="426" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" letter-spacing="0.16em">RESEND · EMAIL</text>

      <!-- Arrows (drawn before nodes) -->
      <!-- 1) Adopt form -> Admin approval -->
      <line x1="300" y1="160" x2="300" y2="304" stroke="#5F5A52" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="314" y="225" width="56" height="12" rx="2" fill="#FBFAF6"/>
      <text x="342" y="234" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPLIES</text>

      <!-- 2) Admin approval -> Box card updated (critical: box becomes public) -->
      <path d="M 400,332 H 420 Q 428,332 428,324 V 276 Q 428,268 436,268" fill="none" stroke="#2C5F4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="442" y="294" width="60" height="12" rx="2" fill="#FBFAF6"/>
      <text x="472" y="303" fill="#2C5F4F" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

      <!-- 3) Adopters (Box card updated) feed "Who to tell" — same lane, dashed reference -->
      <path d="M 600,232 H 900" fill="none" stroke="#5F5A52" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="718" y="212" width="64" height="12" rx="2" fill="#FBFAF6"/>
      <text x="750" y="221" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ADOPTERS</text>

      <!-- 4) Alert sign-up -> Confirm by email -->
      <line x1="720" y1="160" x2="720" y2="404" stroke="#5F5A52" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="734" y="270" width="56" height="12" rx="2" fill="#FBFAF6"/>
      <text x="762" y="279" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRM</text>

      <!-- 5) Confirmed sign-ups feed "Who to tell" — dashed reference, hands off from Resend lane up to Website lane -->
      <path d="M 770,404 V 258 Q 770,250 778,250 H 900" fill="none" stroke="#5F5A52" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="780" y="324" width="68" height="12" rx="2" fill="#FBFAF6"/>
      <text x="814" y="333" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRMED</text>

      <!-- 6) Report empty/problem -> Who to tell -->
      <line x1="1005" y1="160" x2="1005" y2="196" stroke="#5F5A52" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 7) Who to tell -> Send one email each -->
      <line x1="1005" y1="268" x2="1005" y2="404" stroke="#5F5A52" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1019" y="325" width="56" height="12" rx="2" fill="#FBFAF6"/>
      <text x="1047" y="334" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RATE-CAP</text>

      <!-- Nodes -->
      <!-- 1. Adopt form -->
      <rect x="200" y="104" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <text x="300" y="128" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Adopt form</text>
      <text x="300" y="144" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">name, email, box — no sign-in</text>

      <!-- 2. Admin approval -->
      <rect x="200" y="304" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <text x="300" y="328" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Admin approval</text>
      <text x="300" y="344" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">any admin · action logged</text>

      <!-- 3. Box card updated (focal — the box becomes public) -->
      <rect x="410" y="196" width="190" height="72" rx="6" fill="rgba(44,95,79,0.08)" stroke="#2C5F4F" stroke-width="1"/>
      <text x="505" y="220" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Box card updated</text>
      <text x="505" y="236" fill="#2C5F4F" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">shows "Cared for by &lt;name&gt;"</text>
      <text x="505" y="252" fill="#2C5F4F" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">contact email stays private</text>

      <!-- 4. Alert sign-up -->
      <rect x="650" y="104" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <text x="745" y="128" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Alert sign-up</text>
      <text x="745" y="144" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">email + which boxes / area</text>

      <!-- 5. Confirm by email -->
      <rect x="650" y="404" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <text x="745" y="428" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Confirm by email</text>
      <text x="745" y="444" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">click link → confirmed</text>

      <!-- 6. Report empty / problem -->
      <rect x="900" y="104" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <text x="1005" y="128" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Report empty or problem</text>
      <text x="1005" y="144" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">anonymous · no name, no email</text>

      <!-- 7. Who to tell (focal — the notify decision) -->
      <rect x="900" y="196" width="210" height="72" rx="6" fill="rgba(44,95,79,0.08)" stroke="#2C5F4F" stroke-width="1"/>
      <text x="1005" y="220" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Who to tell</text>
      <text x="1005" y="236" fill="#2C5F4F" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">host, adopters, nearby sign-ups</text>
      <text x="1005" y="252" fill="#2C5F4F" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">rate-capped · one email per box</text>

      <!-- 8. Send one email each -->
      <rect x="900" y="404" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <text x="1005" y="428" fill="#2D2A26" font-size="12" font-weight="600" font-family="'Public Sans', sans-serif" text-anchor="middle">Send one email each</text>
      <text x="1005" y="444" fill="#5F5A52" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">every email has a stop link</text>

      <!-- Note -->
      <text x="40" y="496" class="note" fill="#5F5A52">Reports stay anonymous. Only people who opted in — hosts, adopters, sign-ups — ever get an email.</text>

      <!-- Legend -->
      <line x1="40" y1="512" x2="1360" y2="512" stroke="rgba(45,42,38,0.10)" stroke-width="0.8"/>
      <text x="40" y="528" fill="#5F5A52" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="540" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2D2A26" stroke-width="1"/>
      <text x="60" y="548" fill="#5F5A52" font-size="8.5" font-family="'Public Sans', sans-serif">Step</text>

      <rect x="180" y="540" width="14" height="10" rx="2" fill="rgba(44,95,79,0.08)" stroke="#2C5F4F" stroke-width="1"/>
      <text x="200" y="548" fill="#5F5A52" font-size="8.5" font-family="'Public Sans', sans-serif">Public or the notify decision</text>

      <line x1="400" y1="546" x2="428" y2="546" stroke="#2C5F4F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="436" y="548" fill="#5F5A52" font-size="8.5" font-family="'Public Sans', sans-serif">Becomes public</text>

      <line x1="620" y1="546" x2="648" y2="546" stroke="#5F5A52" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="656" y="548" fill="#5F5A52" font-size="8.5" font-family="'Public Sans', sans-serif">Feeds "who to tell"</text>
    </svg>
  </div>
</body>
</html>
