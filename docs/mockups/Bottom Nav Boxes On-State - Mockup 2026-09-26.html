<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFM bottom bar: Boxes "on" options</title>
<style>
  :root { --bone-50:#FBFAF6; --bone-100:#F4F1EA; --bone-300:#D4CDB8; --ink-500:#5F5A52; --ink-400:#6A645A; --rasp:#C2447B; }
  body { margin:0; padding:24px; background:#e9e6df; font:15px/1.4 -apple-system,system-ui,sans-serif; color:#1A1817; }
  h1 { font:600 22px Georgia,serif; margin:0 0 4px; } .sub { color:var(--ink-400); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(2, 400px); gap:26px 34px; }
  .label { font-weight:700; margin-bottom:2px; } .who { font-size:12px; color:var(--ink-400); margin-bottom:8px; }
  .note { font-size:13px; color:var(--ink-400); margin:8px 0 0; }
  .map { width:390px; height:120px; border-radius:18px; padding:28px 12px 0; box-sizing:border-box;
         background:linear-gradient(90deg,transparent 30%,#f3c77a 30%,#f3c77a 31%,transparent 31%), #dfe7d6; }
  .shot img { width:390px; border-radius:18px; display:block; }
  .bar { height:64px; background:var(--bone-50); border:1px solid var(--bone-300); border-radius:999px; display:flex; overflow:hidden;
         box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .it { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-500);
        font-size:12px; font-weight:700; position:relative; cursor:pointer; user-select:none; }
  .it svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ic { display:grid; place-items:center; width:56px; height:30px; border-radius:999px; transition:background .15s; }
  .on { color:var(--rasp); }
  /* B: pill behind the icon only */
  .B .on .ic { background:color-mix(in srgb, var(--rasp) 14%, transparent); }
  /* C: short bar under the word */
  .C .on::after { content:""; position:absolute; bottom:6px; width:18px; height:3px; border-radius:2px; background:var(--rasp); }
  .C .it { padding-bottom:4px; }
  /* D: heart on the door fills in */
  .D .on .heart { fill:var(--rasp); }
  .D .on .ic { transform:scale(1.06); }
  .D .ic { transition:transform .15s; }
</style></head>
<body>
<h1>Bottom bar: how “Boxes on” could look</h1>
<p class="sub">Tap Boxes on any bar to switch it on and off. In every option, the grey circle that sticks around after a tap goes away.</p>
<div class="grid" id="grid"></div>
<template id="bar">
  <div class="bar">
    <div class="it"><span class="ic"><svg viewBox="0 0 24 24"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/></svg></span>Near me</div>
    <div class="it"><span class="ic"><svg viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></span>Saved</div>
    <div class="it on" data-boxes><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6"/><path d="M5 9v11h14V9"/><path class="heart" d="M12 17.5s-3-1.8-3-3.6a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 1.8-3 3.6-3 3.6z"/></svg></span>Boxes</div>
    <div class="it"><span class="ic"><svg viewBox="0 0 24 24"><path d="M11 12h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 14"/><path d="m7 18 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 13 6 6"/></svg></span>Help</div>
    <div class="it"><span class="ic"><svg viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></span>Menu</div>
  </div>
</template>
<script>
  const opts = [
    ["A. Today", "Live dev site (real screenshot)", "A big raspberry circle fills the whole Boxes slot, touching the top and bottom edges of the bar.", "shot"],
    ["B. Small pill behind the icon", "Android (Material 3), Google Maps, Gmail", "A soft raspberry capsule around the icon only, sitting well inside the bar. The word turns raspberry.", "B"],
    ["C. Short line under the word", "Many web apps and older iPhone tab bars", "Icon and word turn raspberry with a small raspberry line underneath. The lightest touch of the three.", "C"],
    ["D. The heart fills in", "iPhone apps (App Store, Music, Photos: “on” = filled icon)", "Icon and word turn raspberry, and the heart on the box's door fills solid. The house stays an outline so the heart doesn't disappear into it.", "D"],
  ];
  const grid = document.getElementById('grid'), tpl = document.getElementById('bar');
  for (const [title, who, note, k] of opts) {
    const col = document.createElement('div');
    col.innerHTML = `<div class="label">${title}</div><div class="who">Seen in: ${who}</div>`;
    if (k === 'shot') {
      col.innerHTML += `<div class="shot"><img src="Bottom Nav Boxes On-State - today 2026-09-26.png" alt="today's bar with Boxes on"></div>`;
    } else {
      const m = document.createElement('div'); m.className = 'map ' + k;
      m.appendChild(tpl.content.cloneNode(true)); col.appendChild(m);
      m.querySelector('[data-boxes]').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
    }
    col.insertAdjacentHTML('beforeend', `<p class="note">${note}</p>`);
    grid.appendChild(col);
  }
</script>
</body></html>
